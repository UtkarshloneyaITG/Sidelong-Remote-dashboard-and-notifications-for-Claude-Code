name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Gate the release on the same checks CI runs. A tag should never produce
      # a binary that would have failed a pull request.
      - run: npm run typecheck
      - run: npm test

      - run: npm run build

      - name: Package installer + portable
        run: npm run dist -w @sidelong/desktop

      - name: Package the VS Code extension
        run: npm run package -w sidelong-claude-status-bar

      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            release/Sidelong-Setup-*.exe
            release/Sidelong-*-portable.exe
            extensions/vscode-bridge/sidelong-claude-status-bar.vsix

  # Separate job because Linux artifacts need a Linux runner -- electron-builder
  # cannot produce an AppImage or a .deb from Windows. It attaches to the same
  # release; whichever job finishes second adds its files to it.
  #
  # These builds are UNVERIFIED: nobody has confirmed always-on-top, tray or
  # notification behaviour on a Linux desktop. Shipped so they can be, and said
  # plainly in the README rather than implied by their existence.
  linux:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      - run: npm run build

      - name: Package AppImage + deb
        run: npm run dist -w @sidelong/desktop

      # `always()` on purpose. These are two independent targets, and v1.1.1
      # proved they fail independently: the AppImage built cleanly and was then
      # thrown away because the .deb could not find a Debian maintainer field.
      # Attaching whatever exists means one broken target costs you that target,
      # not the whole platform. The job still goes red, so nothing is hidden.
      - name: Attach artifacts to the release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            release/Sidelong-*.AppImage
            release/Sidelong-*.deb
