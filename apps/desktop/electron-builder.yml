appId: dev.sidelong.overlay
productName: Sidelong
copyright: Copyright (c) 2026 gamith24

directories:
  output: ../../release
  buildResources: resources

# The main process bundles every dependency (see electron.vite.config.ts), so the
# whole app is out/ plus the icon. No node_modules ship at all.
files:
  - out/**/*
  - resources/**/*
  - package.json

win:
  # portable = a single .exe you can run from anywhere, no install, no admin.
  # nsis     = a normal installer for people who want a Start-menu entry.
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # No icon.ico is committed; electron-builder generates one from the 320x320
  # resources/icon.png, which is above its 256x256 minimum.
  icon: resources/icon.png

nsis:
  oneClick: false
  perMachine: false
  # Adds a first page that says whether this is an install, an update or a
  # reinstall, and names both versions. Picked up from buildResources above.
  include: resources/installer.nsh
  allowToChangeInstallationDirectory: true
  artifactName: Sidelong-Setup-${version}.${ext}
  # Shortcuts the installer CAN create. Windows deliberately offers no API for
  # pinning to the taskbar -- Microsoft removed it so installers cannot hijack
  # it -- so pinning stays a manual right-click on one of these shortcuts.
  # "Start with Windows" is offered inside the app instead, from the tray menu.
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sidelong
  runAfterFinish: true
  allowElevation: false
  deleteAppDataOnUninstall: false

portable:
  artifactName: Sidelong-${version}-portable.${ext}

# Linux, built on a Linux runner. Windows .exe files are not runnable on Linux --
# double-clicking one on Ubuntu hands it to Archive Manager, which reports "an
# error occurred while loading the archive", because an NSIS installer IS a
# self-extracting archive it half-recognises and cannot open.
#
# AppImage first: one file, chmod +x, run. deb for people who want it managed.
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  # REQUIRED, and the reason the first Linux build failed. On Linux
  # electron-builder derives the binary name from the package `name`, and ours is
  # scoped -- "@sidelong/desktop" collapses to "@sidelongdesktop", which contains
  # a character it refuses to put in a file path. Windows never hit this because
  # it uses productName instead.
  executableName: sidelong
  # Ties the running window to the .desktop entry via app_id / WM_CLASS. Without
  # it a desktop environment cannot associate the two -- which matters more here
  # than for a normal app, because this window is always-on-top and users will
  # want window-manager rules to find it.
  syncDesktopName: true
  category: Development
  synopsis: Status bar for Claude Code
  description: >-
    An always-on-top bar showing the live state of every Claude Code session --
    what it is running, what it changed, and when it is silently waiting on a
    permission prompt. Driven by Claude Code's hook system, entirely local.
  icon: resources/icon.png
  artifactName: Sidelong-${version}-${arch}.${ext}

appImage:
  artifactName: Sidelong-${version}-${arch}.${ext}

# Unsigned. Windows SmartScreen will warn on first run; see the README.
forceCodeSigning: false
